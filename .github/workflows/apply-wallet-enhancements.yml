          admin2=admin2.replace("<label className=\"block text-sm text-zinc-400\">Fee type", "<label className=\"block text-sm text-zinc-400\">Nome da taxa exibido ao usuário<input className=\"field mt-2\" value={settings.fee_label??''} onChange={e=>setSettings({...settings,fee_label:e.target.value})} maxLength={100} required/></label><label className=\"block text-sm text-zinc-400\">Instruções exibidas ao usuário<textarea className=\"field mt-2\" rows={4} value={settings.fee_instruction??''} onChange={e=>setSettings({...settings,fee_instruction:e.target.value})} maxLength={2000} required/></label><label className=\"block text-sm text-zinc-400\">Tipo de taxa");
          admin2=admin2.replace("<option value=\"fixed\">Fixed USDT</option><option value=\"percentage\">Percentage</option>","<option value=\"fixed\">Valor fixo (USDT)</option><option value=\"percentage\">Percentual (%)</option>");
          admin2=admin2.replace("alert(r.ok?'Settings saved and audited.':'Unable to save settings')","alert(r.ok?'Configurações salvas e registradas na auditoria.':'Não foi possível salvar as configurações')");
          fs.writeFileSync(path.join(root,'app/admin/page.tsx'),admin2);
