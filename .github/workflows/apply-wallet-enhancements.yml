name: Apply wallet enhancements
on:
  push:
    paths:
      - ".github/workflows/apply-wallet-enhancements.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend build-time application patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d apply-updates.cjs.gz.b64 | gunzip > /tmp/apply-updates.cjs
          python3 - <<'PY'
          p='/tmp/apply-updates.cjs'
          s=open(p).read()
          marker="const depositMigration = String.raw"
          if marker in s:
              s=s[:s.index(marker)]
          open(p,'w').write(s)
          PY
          cat > /tmp/extra.cjs <<'PATCH'
          const depositMigration = String.raw`CREATE TABLE IF NOT EXISTS user_deposit_details (
            user_id UUID PRIMARY KEY REFERENCES users(id) ON DELETE CASCADE,
            network TEXT NOT NULL CHECK (network IN ('TRC20','ERC20')),
            deposit_address TEXT NOT NULL,
            payment_instructions TEXT NOT NULL DEFAULT '',
            active BOOLEAN NOT NULL DEFAULT true,
            updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
          );
          CREATE INDEX IF NOT EXISTS user_deposit_details_active_idx ON user_deposit_details(active);`;
          put('db/migrations/003_user_deposit_details.sql', depositMigration + '\n');

          put('app/api/admin/deposit-details/route.ts', String.raw`import {NextRequest,NextResponse} from 'next/server';
          import {z} from 'zod';
          import {db} from '@/lib/db';
          import {requireAdmin} from '@/lib/auth';
          const schema=z.object({userId:z.string().uuid(),network:z.enum(['TRC20','ERC20']),depositAddress:z.string().trim().min(10).max(300),paymentInstructions:z.string().max(2000).default(''),active:z.boolean().default(true)});
          export async function GET(){try{await requireAdmin();const r=await db.query('SELECT u.id,u.full_name,u.username,u.email,d.network,d.deposit_address,d.payment_instructions,d.active,d.updated_at FROM users u LEFT JOIN user_deposit_details d ON d.user_id=u.id ORDER BY u.created_at DESC LIMIT 500');return NextResponse.json({users:r.rows})}catch{return NextResponse.json({error:'Unauthorized'},{status:401})}}
          export async function PUT(req:NextRequest){try{const a=await requireAdmin();const b=schema.parse(await req.json());const old=await db.query('SELECT network,deposit_address,payment_instructions,active FROM user_deposit_details WHERE user_id=$1',[b.userId]);const r=await db.query('INSERT INTO user_deposit_details(user_id,network,deposit_address,payment_instructions,active,updated_at) VALUES($1,$2,$3,$4,$5,now()) ON CONFLICT(user_id) DO UPDATE SET network=EXCLUDED.network,deposit_address=EXCLUDED.deposit_address,payment_instructions=EXCLUDED.payment_instructions,active=EXCLUDED.active,updated_at=now() RETURNING user_id',[b.userId,b.network,b.depositAddress,b.paymentInstructions,b.active]);await db.query('INSERT INTO admin_audit_logs(admin_id,action,target_type,target_id,reason,before_data,after_data) VALUES($1,\'user_deposit_details_updated\',\'user\',$2,\'Per-user deposit instructions updated\',$3,$4)',[a.id,b.userId,JSON.stringify(old.rows[0]??null),JSON.stringify({network:b.network,deposit_address:b.depositAddress,payment_instructions:b.paymentInstructions,active:b.active})]);return NextResponse.json({ok:true,userId:r.rows[0].user_id})}catch(e){return NextResponse.json({error:e instanceof Error?e.message:'Não foi possível salvar os dados de depósito.'},{status:400})}}`);

          put('app/api/deposit-details/route.ts', String.raw`import {NextResponse} from 'next/server';
          import {db} from '@/lib/db';
          import {requireUser} from '@/lib/auth';
          export async function GET(){try{const s=await requireUser();const r=await db.query('SELECT network,deposit_address,payment_instructions FROM user_deposit_details WHERE user_id=$1 AND active=true',[s.id]);return NextResponse.json({depositDetails:r.rows[0]??null})}catch{return NextResponse.json({error:'Acesso não autorizado.'},{status:401})}}`);

          put('app/admin/deposit-details/page.tsx', String.raw`'use client';
          import {useEffect,useState} from 'react';
          import Link from 'next/link';
          type User={id:string;full_name:string;username:string;email:string;network:string|null;deposit_address:string|null;payment_instructions:string|null;active:boolean|null};
          export default function DepositDetailsAdmin(){const [users,setUsers]=useState<User[]>([]),[userId,setUserId]=useState(''),[network,setNetwork]=useState('TRC20'),[address,setAddress]=useState(''),[instructions,setInstructions]=useState(''),[active,setActive]=useState(true),[message,setMessage]=useState(''),[busy,setBusy]=useState(false);
          async function load(){const r=await fetch('/api/admin/deposit-details');if(r.status===401){setMessage('Faça login no painel administrativo.');return}const j=await r.json();setUsers(j.users??[])}
          useEffect(()=>{load()},[]);
          function choose(id:string){setUserId(id);const u=users.find(x=>x.id===id);setNetwork(u?.network||'TRC20');setAddress(u?.deposit_address||'');setInstructions(u?.payment_instructions||'');setActive(u?.active??true);setMessage('')}
          async function save(e:React.FormEvent){e.preventDefault();setBusy(true);setMessage('');const r=await fetch('/api/admin/deposit-details',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({userId,network,depositAddress:address,paymentInstructions:instructions,active})});const j=await r.json();setBusy(false);if(!r.ok){setMessage(j.error||'Não foi possível salvar.');return}setMessage('Detalhes de depósito salvos e registrados na auditoria.');await load()}
          return <main className="min-h-screen bg-black text-white p-4 sm:p-6"><div className="max-w-xl mx-auto space-y-5"><Link href="/admin" className="text-amber-400 text-sm">← Voltar ao painel</Link><h1 className="text-2xl font-semibold">Detalhes de depósito por usuário</h1><p className="text-sm text-zinc-400">Configure o endereço e as instruções individualmente. Cada usuário verá somente os dados atribuídos à própria conta.</p><form onSubmit={save} className="panel p-5 space-y-4"><label className="block text-sm text-zinc-300">Usuário<select className="field mt-2" value={userId} onChange={e=>choose(e.target.value)} required><option value="">Selecione um usuário</option>{users.map(u=><option key={u.id} value={u.id}>{u.username} — {u.email}</option>)}</select></label><label className="block text-sm text-zinc-300">Rede<select className="field mt-2" value={network} onChange={e=>setNetwork(e.target.value)}><option value="TRC20">USDT TRC20</option><option value="ERC20">USDT ERC20</option></select></label><label className="block text-sm text-zinc-300">Endereço de depósito<input className="field mt-2" value={address} onChange={e=>setAddress(e.target.value)} minLength={10} maxLength={300} required placeholder="Informe o endereço correto"/></label><label className="block text-sm text-zinc-300">Instruções para o usuário<textarea className="field mt-2" rows={4} value={instructions} onChange={e=>setInstructions(e.target.value)} placeholder="Instruções específicas para este usuário"/></label><label className="flex items-center gap-2 text-sm text-zinc-300"><input type="checkbox" checked={active} onChange={e=>setActive(e.target.checked)}/> Ativar estes dados de depósito</label>{message&&<p className="text-sm text-amber-300">{message}</p>}<button className="primary w-full" disabled={busy||!userId}>{busy?'Salvando…':'Salvar dados de depósito'}</button></form></div></main>}`);

          let dash=fs.readFileSync(path.join(root,'app/dashboard/page.tsx'),'utf8');
          dash=dash.replace("const [wallet,setWallet]=useState<Wallet|null>(null),","const [depositDetails,setDepositDetails]=useState<any>(null),[wallet,setWallet]=useState<Wallet|null>(null),");
          dash=dash.replace("setTx(j.transactions??[])}","setTx(j.transactions??[]);const dr=await fetch('/api/deposit-details');if(dr.ok){const dj=await dr.json();setDepositDetails(dj.depositDetails??null);if(dj.depositDetails?.network)setRede(dj.depositDetails.network)}}");
          dash=dash.replace("{modal==='withdrawal'&&<label className=\"block text-sm text-zinc-400\">Destination address", "{modal==='deposit'&&<div className=\"rounded-xl border border-amber-500/30 bg-amber-500/5 p-4 space-y-2\">{depositDetails?<><div className=\"text-sm font-semibold text-amber-300\">Seus dados de depósito · {depositDetails.network}</div><div className=\"break-all text-sm text-white\">{depositDetails.deposit_address}</div><button type=\"button\" className=\"secondary text-xs\" onClick={()=>navigator.clipboard.writeText(depositDetails.deposit_address)}>Copiar endereço</button>{depositDetails.payment_instructions&&<p className=\"text-xs text-zinc-300 whitespace-pre-wrap\">{depositDetails.payment_instructions}</p>}</>:<p className=\"text-xs text-amber-300\">O administrador ainda não configurou os dados de depósito para sua conta. Não envie fundos até que os dados sejam exibidos aqui.</p>}</div>}{modal==='withdrawal'&&<label className=\"block text-sm text-zinc-400\">Destination address");
          dash=dash.replace("const body=modal==='deposit'?{amount,network}:{amount,network,destination};","const body=modal==='deposit'?{amount,network}:{amount,network,destination};if(modal==='deposit'&&!depositDetails){setBusy(false);setMsg('Os dados de depósito ainda não foram configurados para sua conta.');return}");
          fs.writeFileSync(path.join(root,'app/dashboard/page.tsx'),dash);

          put('app/api/deposits/route.ts', String.raw`import Decimal from 'decimal.js';
          import {NextRequest,NextResponse} from 'next/server';import {z} from 'zod';import {db} from '@/lib/db';import {requireUser} from '@/lib/auth';import {reference} from '@/lib/http';
          const schema=z.object({amount:z.string().regex(/^\d+(\.\d{1,8})?$/),network:z.enum(['TRC20','ERC20'])});
          export async function POST(req:NextRequest){const c=await db.connect();let begun=false;try{const s=await requireUser();const b=schema.parse(await req.json());const amount=new Decimal(b.amount);if(!amount.isPositive()||amount.gt('9999999999999999999999'))throw new Error('Valor inválido.');const cfg=await c.query('SELECT network FROM user_deposit_details WHERE user_id=$1 AND active=true',[s.id]);if(!cfg.rowCount)throw new Error('Os dados de depósito não estão configurados para sua conta.');if(cfg.rows[0].network!==b.network)throw new Error('Selecione a rede atribuída à sua conta.');const w=await c.query("SELECT id FROM wallets WHERE user_id=$1 AND asset='USDT'",[s.id]);if(!w.rowCount)throw new Error('Carteira não encontrada.');const ref=reference('DEP');await c.query('BEGIN');begun=true;await c.query("INSERT INTO deposits(user_id,wallet_id,network,amount,reference,status) VALUES($1,$2,$3,$4,$5,'pending')",[s.id,w.rows[0].id,b.network,amount.toFixed(8),ref]);await c.query("INSERT INTO transactions(user_id,wallet_id,kind,amount,status,reference,note) VALUES($1,$2,'deposit',$3,'pending',$4,'Deposit request pending independent verification')",[s.id,w.rows[0].id,amount.toFixed(8),ref]);await c.query('COMMIT');return NextResponse.json({ok:true,reference:ref,status:'pending',message:'Solicitação criada. O saldo só será alterado após confirmação verificada.'})}catch(e){if(begun)await c.query('ROLLBACK');return NextResponse.json({error:e instanceof Error?e.message:'Solicitação de depósito inválida.'},{status:400})}finally{c.release()}}`);

          let adj=fs.readFileSync(path.join(root,'app/api/admin/adjustments/route.ts'),'utf8');
          adj=adj.replace("z.enum(['credit','debit'])","z.enum(['credit','debit','set'])");
          adj=adj.replace("if(!amount.isPositive()||amount.gt(10000000))throw new Error('Invalid amount');if(b.direction==='debit'&&before.lt(amount))throw new Error('Insufficient balance for debit');const delta=b.direction==='credit'?amount:amount.negated();const after=before.plus(delta);","if((b.direction!=='set'&&!amount.isPositive())||amount.lt(0)||amount.gt('9999999999999999999999'))throw new Error('Invalid amount');if(b.direction==='debit'&&before.lt(amount))throw new Error('Insufficient balance for debit');const delta=b.direction==='set'?amount.minus(before):(b.direction==='credit'?amount:amount.negated());const after=b.direction==='set'?amount:before.plus(delta);if(delta.isZero())throw new Error('The requested balance is already set');");
          adj=adj.replace("b.direction==='credit'?'admin_credit':'admin_debit'","delta.isPositive()?'admin_credit':'admin_debit'");
          adj=adj.replace("amount.toFixed(8),ref,b.reason","delta.abs().toFixed(8),ref,b.reason");
          fs.writeFileSync(path.join(root,'app/api/admin/adjustments/route.ts'),adj);
          let admin=fs.readFileSync(path.join(root,'app/admin/page.tsx'),'utf8');
          admin=admin.replace('in_use:string};type Stats','in_use:string;created_at:string};type Stats');
          admin=admin.replace('<option value="debit">Debit</option>','<option value="debit">Debit</option><option value="set">Definir saldo exato</option>');
          admin=admin.replace('</header><div className="wrap py-8','<a href="/admin/deposit-details" className="text-xs text-amber-400 border border-amber-500/30 rounded-lg px-3 py-2">Detalhes de depósito por usuário</a></header><div className="wrap py-8');
          fs.writeFileSync(path.join(root,'app/admin/page.tsx'),admin);
          let css=fs.readFileSync(path.join(root,'app/globals.css'),'utf8');
          css=css.replace('.wallet-wrap{width:min(100% - 44px,620px);margin:0 auto}', '.wallet-wrap{width:min(100% - 32px,430px);margin:0 auto}');
          fs.writeFileSync(path.join(root,'app/globals.css'),css);
          console.log('Applied mobile-width wallet, per-user deposit details and exact-balance admin controls.');
          PATCH
          cat /tmp/extra.cjs >> /tmp/apply-updates.cjs
          gzip -n -9 -c /tmp/apply-updates.cjs | base64 -w0 > apply-updates.cjs.gz.b64

          cat >> /tmp/apply-updates.cjs <<'PATCH'
          put('db/migrations/004_withdrawal_pix_and_fee_copy.sql', String.raw`ALTER TABLE withdrawal_settings ADD COLUMN IF NOT EXISTS fee_label TEXT NOT NULL DEFAULT 'Taxa de saque';
          ALTER TABLE withdrawal_settings ADD COLUMN IF NOT EXISTS fee_instruction TEXT NOT NULL DEFAULT 'A taxa será considerada no processamento do saque.';
          ALTER TABLE withdrawals ADD COLUMN IF NOT EXISTS withdrawal_method TEXT NOT NULL DEFAULT 'usdt';
          ALTER TABLE withdrawals ADD COLUMN IF NOT EXISTS bank_name TEXT;
          ALTER TABLE withdrawals ADD COLUMN IF NOT EXISTS account_holder TEXT;
          ALTER TABLE withdrawals ADD COLUMN IF NOT EXISTS pix_key TEXT;
          ALTER TABLE withdrawals DROP CONSTRAINT IF EXISTS withdrawals_network_check;
          ALTER TABLE withdrawals ADD CONSTRAINT withdrawals_network_check CHECK (network IN ('TRC20','ERC20','PIX'));`);
          put('app/api/admin/settings/route.ts', String.raw`import {NextRequest,NextResponse} from 'next/server';import {z} from 'zod';import {db} from '@/lib/db';import {requireAdmin} from '@/lib/auth';
          const schema=z.object({feeType:z.enum(['fixed','percentage']),feeValue:z.coerce.number().min(0).max(1000000000000),minAmount:z.coerce.number().positive(),maxAmount:z.coerce.number().positive(),networks:z.array(z.enum(['TRC20','ERC20'])).min(1),feeLabel:z.string().trim().min(2).max(100),feeInstruction:z.string().trim().min(2).max(2000)});
          export async function GET(){try{await requireAdmin();const r=await db.query('SELECT fee_type,fee_value::text,min_amount::text,max_amount::text,enabled_networks,fee_label,fee_instruction FROM withdrawal_settings WHERE id=1');return NextResponse.json(r.rows[0])}catch{return NextResponse.json({error:'Não autorizado.'},{status:401})}}
          export async function PUT(req:NextRequest){try{const a=await requireAdmin();const b=schema.parse(await req.json());if(b.maxAmount<b.minAmount)throw new Error('O valor máximo deve ser maior que o mínimo.');const old=await db.query('SELECT * FROM withdrawal_settings WHERE id=1');await db.query('UPDATE withdrawal_settings SET fee_type=$1,fee_value=$2,min_amount=$3,max_amount=$4,enabled_networks=$5,fee_label=$6,fee_instruction=$7,updated_at=now() WHERE id=1',[b.feeType,b.feeValue,b.minAmount,b.maxAmount,b.networks,b.feeLabel,b.feeInstruction]);await db.query("INSERT INTO admin_audit_logs(admin_id,action,target_type,target_id,reason,before_data,after_data) VALUES($1,'withdrawal_settings_updated','settings','1','Configuração da taxa de saque alterada',$2,$3)",[a.id,JSON.stringify(old.rows[0]),JSON.stringify(b)]);return NextResponse.json({ok:true})}catch(e){return NextResponse.json({error:e instanceof Error?e.message:'Configuração inválida.'},{status:400})}}`);
          put('app/api/withdrawals/route.ts', String.raw`import Decimal from 'decimal.js';import {NextRequest,NextResponse} from 'next/server';import {z} from 'zod';import {db} from '@/lib/db';import {requireUser} from '@/lib/auth';import {reference} from '@/lib/http';
          const schema=z.object({amount:z.string().regex(/^\d+(\.\d{1,8})?$/),method:z.enum(['pix','usdt']),network:z.enum(['TRC20','ERC20']).optional(),destination:z.string().max(160).optional(),bankName:z.string().trim().max(120).optional(),accountHolder:z.string().trim().max(160).optional(),pixKey:z.string().trim().max(160).optional()});
          export async function POST(req:NextRequest){const c=await db.connect();let begun=false;try{const s=await requireUser();const b=schema.parse(await req.json());if(b.method==='usdt'&&(!b.network||!b.destination||b.destination.length<20))throw new Error('Informe a rede e o endereço USDT corretamente.');if(b.method==='pix'&&(!b.bankName||!b.accountHolder||!b.pixKey))throw new Error('Informe o banco, o nome completo e a chave PIX.');const amount=new Decimal(b.amount);if(!amount.isPositive()||amount.gt('1000000000000'))throw new Error('Valor de saque inválido.');await c.query('BEGIN');begun=true;const set=await c.query('SELECT * FROM withdrawal_settings WHERE id=1 FOR SHARE');const cfg=set.rows[0];if(amount.lt(cfg.min_amount)||amount.gt(cfg.max_amount)||(b.method==='usdt'&&!cfg.enabled_networks.includes(b.network)))throw new Error('O valor ou a rede está fora dos limites configurados.');const fee=cfg.fee_type==='fixed'?new Decimal(cfg.fee_value):amount.mul(cfg.fee_value).div(100);const total=amount.plus(fee);const w=await c.query("SELECT id,available FROM wallets WHERE user_id=$1 AND asset='USDT' FOR UPDATE",[s.id]);if(!w.rowCount||new Decimal(w.rows[0].available).lt(total))throw new Error('Saldo disponível insuficiente para o saque e a taxa.');await c.query('UPDATE wallets SET available=available-$1,in_use=in_use+$2 WHERE id=$3',[total.toFixed(8),total.toFixed(8),w.rows[0].id]);const ref=reference('WDR');const destination=b.method==='pix'?JSON.stringify({bankName:b.bankName,accountHolder:b.accountHolder,pixKey:b.pixKey}):b.destination;const network=b.method==='pix'?'PIX':b.network;await c.query("INSERT INTO withdrawals(user_id,wallet_id,network,destination,amount,fee,total_debit,reference,status,withdrawal_method,bank_name,account_holder,pix_key) VALUES($1,$2,$3,$4,$5,$6,$7,$8,'pending',$9,$10,$11,$12)",[s.id,w.rows[0].id,network,destination,amount.toFixed(8),fee.toFixed(8),total.toFixed(8),ref,b.method,b.bankName??null,b.accountHolder??null,b.pixKey??null]);await c.query("INSERT INTO transactions(user_id,wallet_id,kind,amount,fee,status,reference,note) VALUES($1,$2,'withdrawal',$3,$4,'pending',$5,'Solicitação de saque pendente de análise administrativa; nenhuma transferência foi enviada')",[s.id,w.rows[0].id,amount.toFixed(8),fee.toFixed(8),ref]);await c.query('COMMIT');begun=false;return NextResponse.json({ok:true,reference:ref,amount:amount.toFixed(8),fee:fee.toFixed(8),totalDebit:total.toFixed(8),feeLabel:cfg.fee_label,feeInstruction:cfg.fee_instruction,method:b.method,status:'pending',message:'Solicitação registrada e aguardando análise. Nenhuma transferência foi enviada.'})}catch(e){if(begun)await c.query('ROLLBACK');return NextResponse.json({error:e instanceof Error?e.message:'Não foi possível registrar o saque.'},{status:400})}finally{c.release()}}`);
          let dash2=fs.readFileSync(path.join(root,'app/dashboard/page.tsx'),'utf8');
          dash2=dash2.replace("[busy,setBusy]=useState(false);const router=", "[busy,setBusy]=useState(false),[withdrawStep,setWithdrawStep]=useState(1),[withdrawMethod,setWithdrawMethod]=useState('pix'),[bankName,setBankName]=useState(''),[accountHolder,setAccountHolder]=useState(''),[pixKey,setPixKey]=useState(''),[feeInfo,setFeeInfo]=useState<any>(null),[feeVisible,setFeeVisible]=useState(false);const router=");
          dash2=dash2.replace("async function logout(){", "async function submitWithdrawal(){if(!amount||Number(amount)<=0){setMsg('Informe um valor válido.');return}setBusy(true);setMsg('');const payload=withdrawMethod==='pix'?{amount,method:'pix',bankName,accountHolder,pixKey}:{amount,method:'usdt',network,destination};const r=await fetch('/api/withdrawals',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();setBusy(false);if(!r.ok){setMsg(j.error||'Não foi possível solicitar o saque.');return}setFeeInfo(j);window.setTimeout(()=>setFeeVisible(true),3000);setWithdrawStep(4)}async function logout(){");
          const modalStart=dash2.indexOf('{modal&&<div');
          const modalEnd=modalStart>=0?dash2.indexOf('</form></div>}',modalStart):-1;
          if(modalStart<0||modalEnd<0) throw new Error('Could not locate dashboard modal boundaries');
          dash2=dash2.slice(0,modalStart)+modalUi+dash2.slice(modalEnd+'</form></div>}'.length);
          const modalUi = String.raw`{modal&&<div className="fixed inset-0 bg-black/85 grid place-items-center p-4 z-50"><form onSubmit={e=>{if(modal==='deposit')action(e);else e.preventDefault()}} className="panel p-6 w-full max-w-md space-y-4"><div className="flex justify-between"><h2 className="text-xl font-semibold">{modal==='deposit'?'Depositar USDT':withdrawStep===1?'Valor do saque':withdrawStep===2?'Método de saque':'Dados para saque'}</h2><button type="button" onClick={()=>setModal(null)} className="text-zinc-400">✕</button></div>{modal==='deposit'?<><label className="block text-sm text-zinc-400">Valor (USDT)<input className="field mt-2" type="number" min="0.00000001" step="0.00000001" value={amount} onChange={e=>setAmount(e.target.value)} required/></label><label className="block text-sm text-zinc-400">Rede<select className="field mt-2" value={network} onChange={e=>setNetwork(e.target.value)}><option>TRC20</option><option>ERC20</option></select></label><p className="text-xs text-amber-300">Ambiente de demonstração. O depósito só será confirmado após verificação.</p><button className="primary w-full" disabled={busy}>{busy?'Enviando…':'Continuar'}</button></>:<>{withdrawStep===1&&<><label className="block text-sm text-zinc-300">Quanto deseja sacar? (USDT)<input className="field mt-2" type="number" min="0.00000001" step="0.00000001" value={amount} onChange={e=>setAmount(e.target.value)} required placeholder="Digite o valor"/></label><button type="button" className="primary w-full" disabled={!amount||Number(amount)<=0} onClick={()=>{setMsg('');setWithdrawStep(2)}}>Prosseguir</button></>}{withdrawStep===2&&<><p className="text-sm text-zinc-300">Selecione a forma de saque:</p><button type="button" onClick={()=>setWithdrawMethod('pix')} className="w-full rounded-xl border p-4 text-left border-zinc-700"><strong>PIX</strong><span className="block text-xs text-zinc-400 mt-1">Saque para uma conta bancária via PIX</span></button><button type="button" onClick={()=>setWithdrawMethod('usdt')} className="w-full rounded-xl border p-4 text-left border-zinc-700"><strong>USDT</strong><span className="block text-xs text-zinc-400 mt-1">Saque para uma carteira de criptomoedas</span></button><div className="flex gap-3"><button type="button" className="secondary w-full" onClick={()=>setWithdrawStep(1)}>Voltar</button><button type="button" className="primary w-full" onClick={()=>setWithdrawStep(3)}>Continuar</button></div></>}{withdrawStep===3&&<>{withdrawMethod==='pix'?<><label className="block text-sm text-zinc-300">Nome do banco<input className="field mt-2" value={bankName} onChange={e=>setBankName(e.target.value)} required placeholder="Ex.: Banco do Brasil"/></label><label className="block text-sm text-zinc-300">Nome completo do titular<input className="field mt-2" value={accountHolder} onChange={e=>setAccountHolder(e.target.value)} required placeholder="Nome conforme consta no banco"/></label><label className="block text-sm text-zinc-300">Chave PIX<input className="field mt-2" value={pixKey} onChange={e=>setPixKey(e.target.value)} required placeholder="CPF, e-mail, telefone ou chave aleatória"/></label></>:<><label className="block text-sm text-zinc-300">Rede USDT<select className="field mt-2" value={network} onChange={e=>setNetwork(e.target.value)}><option>TRC20</option><option>ERC20</option></select></label><label className="block text-sm text-zinc-300">Endereço da carteira USDT<input className="field mt-2" value={destination} onChange={e=>setDestination(e.target.value)} minLength={20} required placeholder="Informe o endereço de destino"/></label></>}<p className="text-xs text-zinc-400">Confira todos os dados antes de solicitar. A solicitação ficará pendente de análise.</p>{msg&&<p className="text-sm text-red-400">{msg}</p>}<div className="flex gap-3"><button type="button" className="secondary w-full" onClick={()=>setWithdrawStep(2)}>Voltar</button><button type="button" className="primary w-full" disabled={busy||(withdrawMethod==='pix'?(!bankName.trim()||!accountHolder.trim()||!pixKey.trim()):destination.length<20)} onClick={submitWithdrawal}>{busy?'Processando…':'Solicitar saque'}</button></div></>}{withdrawStep===4&&!feeVisible&&<p className="text-sm text-zinc-300 text-center py-6">Solicitação registrada. Aguarde enquanto carregamos os detalhes da taxa…</p>}</>}</form>{feeVisible&&feeInfo&&<div className="fixed inset-0 bg-black/90 grid place-items-center p-4 z-[60]"><div className="panel p-6 w-full max-w-md space-y-4"><h2 className="text-xl font-semibold">{feeInfo.feeLabel||'Taxa de saque'}</h2><div className="rounded-xl border border-red-500/40 bg-red-500/10 p-4"><div className="text-sm text-zinc-300">Valor da taxa</div><div className="text-2xl font-bold text-white">⚠️ {Number(feeInfo.fee).toFixed(8)} USDT</div></div><p className="text-sm text-zinc-200 whitespace-pre-wrap">{feeInfo.feeInstruction}</p><p className="text-xs text-zinc-400">Solicitação: {feeInfo.reference}. A taxa já está incluída no débito total reservado de {Number(feeInfo.totalDebit).toFixed(8)} USDT. Não envie pagamentos externos por esta tela. O saque permanece pendente de análise.</p><button className="primary w-full" onClick={()=>{setFeeVisible(false);setModal(null);setAmount('');setDestination('');setBankName('');setAccountHolder('');setPixKey('');setWithdrawStep(1);load()}}>Entendi</button></div></div>}</div>}`;
          if(!modalRegex.test(dash2)){const i=dash2.indexOf('modal');console.log('MODAL_DEBUG',dash2.slice(Math.max(0,i-100),i+2200));throw new Error('Could not locate existing dashboard modal for safe replacement');}
          dash2=dash2.replace(modalRegex,modalUi);
          dash2=dash2.replace("setModal('withdrawal');setMsg('')","setModal('withdrawal');setMsg('');setWithdrawStep(1);setAmount('');setFeeVisible(false)");
          fs.writeFileSync(path.join(root,'app/dashboard/page.tsx'),dash2);
          let admin2=fs.readFileSync(path.join(root,'app/admin/page.tsx'),'utf8');
