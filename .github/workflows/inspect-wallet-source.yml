name: Inspect wallet source
on:
  push:
    paths:
      - ".github/workflows/inspect-wallet-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract application source
        run: |
          unzip -q cryptowallet-render-source.zip
          for f in cryptowallet-render/app/globals.css cryptowallet-render/app/dashboard/page.tsx cryptowallet-render/app/admin/page.tsx cryptowallet-render/app/api/deposits/route.ts cryptowallet-render/app/api/wallet/route.ts cryptowallet-render/app/api/admin/adjustments/route.ts cryptowallet-render/app/api/admin/users/route.ts cryptowallet-render/app/api/admin/deposits/route.ts; do
            echo "===== $f ====="
            sed -n '1,260p' "$f"
          done
