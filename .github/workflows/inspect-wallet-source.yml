name: Inspect wallet source
on:
  push:
    paths:
      - ".github/workflows/inspect-wallet-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract application source
        run: |
          unzip -q cryptowallet-render-source.zip
          base64 -d apply-updates.cjs.gz.b64 | gunzip > /tmp/apply-updates.cjs
          echo "===== PATCH SCRIPT SUMMARY ====="
          wc -l -c /tmp/apply-updates.cjs
          grep -nEi "deposit_settings|user_deposit|adjustments|wallet-wrap|grid-cols|admin/settings|deposit" /tmp/apply-updates.cjs | tail -35
          echo "===== PATCH SCRIPT END ====="
          tail -45 /tmp/apply-updates.cjs
          echo "===== DEPOSIT SETTINGS API AND ADMIN CONFIG ====="
          for f in cryptowallet-render/app/api/admin/settings/route.ts cryptowallet-render/app/api/admin/deposit-settings/route.ts cryptowallet-render/db/migrations/003_user_deposit_settings.sql cryptowallet-render/app/api/deposit-settings/route.ts; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
