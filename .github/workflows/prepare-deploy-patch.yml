name: Prepare Render deployment patch
on:
  push:
    branches: [main]
    paths:
      - "patch-admin-append.cjs.gz.b64"
      - "patch-trigger.txt"
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append admin controls to deployment script
        run: |
          base64 -d patch-admin-append.cjs.gz.b64 | gunzip > patch-admin-append.cjs
          base64 -d apply-updates.cjs.gz.b64 | gunzip > apply-updates.cjs
          cat patch-admin-append.cjs >> apply-updates.cjs
          gzip -9 -c apply-updates.cjs | base64 -w0 > apply-updates.cjs.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apply-updates.cjs.gz.b64
          git commit -m "Build wallet admin deployment patch"
          git push
