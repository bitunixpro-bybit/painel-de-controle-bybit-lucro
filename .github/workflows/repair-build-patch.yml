name: Export wallet build patch for review
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-build-patch.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export generated patch source
        run: |
          node <<'NODE'
          const fs=require('node:fs'),zlib=require('node:zlib');
          const source=zlib.gunzipSync(Buffer.from(fs.readFileSync('apply-updates.cjs.gz.b64','utf8').trim(),'base64')).toString('utf8');
          fs.writeFileSync('patch-source-review.txt',source);
          NODE
      - name: Commit review source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-source-review.txt
          git commit -m "Export generated build patch for review"
          git push
