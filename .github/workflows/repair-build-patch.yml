name: Repair wallet build patch
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-build-patch.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace duplicate lexical helper declarations
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const file = 'apply-updates.cjs.gz.b64';
          const source = zlib.gunzipSync(Buffer.from(fs.readFileSync(file, 'utf8').trim(), 'base64')).toString('utf8');
          const matches = source.match(/\bconst\s+edit\s*=/g) || [];
          console.log('Found const edit declarations:', matches.length);
          const fixed = source.replace(/\bconst\s+edit\s*=/g, 'var edit=');
          if (fixed === source) throw new Error('No const edit helper declaration found.');
          fs.writeFileSync(file, zlib.gzipSync(Buffer.from(fixed)).toString('base64') + '\n');
          console.log('Converted ' + matches.length + ' declaration(s) to redeclarable var.');
          NODE
      - name: Commit repaired build patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apply-updates.cjs.gz.b64
          git commit -m "Fix duplicate declaration in wallet build patch"
          git push
