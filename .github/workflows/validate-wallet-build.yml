name: Validate wallet production build
on:
  push:
    paths:
      - ".github/workflows/validate-wallet-build.yml"
      - "apply-updates.cjs.gz.b64"
      - "cryptowallet-render-source.zip"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cryptowallet-render/package-lock.json
      - name: Apply source patch and build
        run: |
          set -euo pipefail
          unzip -q cryptowallet-render-source.zip
          base64 -d apply-updates.cjs.gz.b64 | gunzip > apply-updates.cjs
          node apply-updates.cjs
          cp -R cryptowallet-render/. .
          npm install --no-audit --no-fund
          npm run build
