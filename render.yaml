services:
  - type: web
    name: painel-bybit-wallet
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: unzip -q cryptowallet-render-source.zip && cp -R cryptowallet-render/. . && rm -rf cryptowallet-render cryptowallet-render-source.zip && npm install && npm run db:migrate && npm run build
    startCommand: npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: painel-bybit-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SANDBOX_MODE
        value: "true"
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: painel-bybit-db
    databaseName: cryptowallet
    user: cryptowallet
    plan: free
    region: frankfurt
    postgresMajorVersion: 18
